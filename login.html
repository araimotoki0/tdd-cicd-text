<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0b1020">
    <meta name="robots" content="noindex">
    <title>ログイン - CSD講座</title>
    <link rel="icon" href="icons/icon-192.png">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="CSD講座">
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 24px; padding-top: calc(24px + env(safe-area-inset-top)); background: #0b1020; color: #1d2433; font-family: 'Hiragino Sans', 'Noto Sans JP', sans-serif; }
        .card { width: 100%; max-width: 400px; background: #fff; border-radius: 24px; padding: 32px 28px; box-shadow: 0 30px 60px -20px rgba(0,0,0,.6); }
        .mark { width: 56px; height: 56px; border-radius: 16px; background: #0b1020; color: #fff; display: grid; place-items: center; font-weight: 900; font-size: 18px; letter-spacing: .04em; margin-bottom: 18px; }
        h1 { font-size: 22px; margin: 0 0 6px; }
        p { margin: 0 0 20px; color: #5b6475; font-size: 14px; line-height: 1.7; }
        label { display: block; font-size: 12px; font-weight: 700; color: #5b6475; margin-bottom: 6px; letter-spacing: .06em; }
        input { width: 100%; font-size: 17px; padding: 12px 14px; border-radius: 12px; border: 1.5px solid #e7e3da; background: #faf9f6; outline: none; }
        input:focus { border-color: #3f5f85; background: #fff; }
        button { width: 100%; margin-top: 14px; padding: 14px; border: 0; border-radius: 12px; background: #0b1020; color: #fff; font-size: 16px; font-weight: 700; cursor: pointer; }
        button:hover { background: #131a33; }
        .err { display: none; margin: 0 0 12px; padding: 10px 12px; border-radius: 10px; background: #faf0ee; color: #8f3a30; font-size: 13px; }
        .err.show { display: block; }
        .foot { margin-top: 18px; font-size: 12px; color: #8a93a5; text-align: center; }
    </style>
</head>
<body>
    <form class="card" id="f" method="get" action="/auth" autocomplete="on">
        <img class="mark" src="icons/icon-192.png" alt="" width="56" height="56">
        <h1>CSD 講座テキスト</h1>
        <p>講義で案内したユーザー名とパスワードを入力してください。この端末では、次回から入力なしで開けます。</p>
        <div class="err" id="err">ユーザー名またはパスワードが違います。もう一度お試しください。</div>
        <label for="u">ユーザー名</label>
        <input id="u" name="u" type="text" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required autofocus>
        <label for="pw" style="margin-top:12px">パスワード</label>
        <input id="pw" name="pw" type="password" autocomplete="current-password" required>
        <input type="hidden" name="next" id="next" value="/home.html">
        <button type="submit">ログイン</button>
        <p class="foot">受講者の方だけにお渡ししている情報です</p>
    </form>
    <script>
        var q = new URLSearchParams(location.search);
        if (q.get('e')) document.getElementById('err').classList.add('show');
        var n = q.get('next'); if (n && n.charAt(0) === '/') document.getElementById('next').value = n;
    </script>
</body>
</html>
